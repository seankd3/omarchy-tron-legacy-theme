# The bar is glass over the Grid (Glassy bar keeps at most 0.35 of this
# background); its lit lower edge is drawn by the backdrop behind it.
background       = "#020508"
background-alpha = 1.0
text             = "#c8fbff"
# Omarchy shares this token between recording, updates, and other alerts.
active           = "#ff8a1f"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
